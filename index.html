<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>公園無菸大作戰 劇本</title>
<style>
/* Layout: title, sticky tool bar (role / 中文 / 難字 / 字級), one script column, fixed progress bar. Palette follows the 社大工作台: warm paper, soft-lift cards, one blue primary, low-chroma role colours. */
:root{
  --ink:#20303a; --ink-soft:#4f5c65; --faint:#76818a;
  --paper:#f1efea; --card:#fffdf9;
  --line:#c4c8be; --line2:#d3dbe3; --sep:#ecede8;
  --pri:#1d6fa5; --pri-soft:#e7eff6; --pri-line:#9fb9d0;
  --band:#dfe8f1; --board:#e6ecf2;
  --lift:0 1px 2px rgba(32,48,58,.07),0 3px 10px rgba(32,48,58,.05);
  --r-sm:7px; --r:11px; --r-lg:14px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
  --fs:19px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font);line-height:1.55;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;touch-action:manipulation;-webkit-user-select:none;user-select:none}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.wrap{max-width:680px;margin:0 auto}

/* title */
.head{padding:calc(18px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 6px max(16px, env(safe-area-inset-left))}
h1{margin:0;font-size:1.5rem;line-height:1.25;letter-spacing:.5px;text-wrap:balance}
.sub{color:var(--ink-soft);font-size:.92rem;margin-top:2px}

/* sticky tools */
.tools{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line2);
  padding:8px max(16px, env(safe-area-inset-right)) 8px max(16px, env(safe-area-inset-left))}
.tools .wrap{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px}
.tbtn{height:44px;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:0 6px;font-size:.95rem;
  display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;white-space:nowrap;min-width:0}
.tbtn:active{background:var(--board)}
.tbtn[aria-pressed="true"]{background:var(--pri);border-color:var(--pri);color:#fff}
.tbtn.role{justify-content:center;padding:0 8px;letter-spacing:-.02em;border-color:var(--pri-line);background:var(--pri-soft);color:var(--pri);font-weight:700}
.tbtn.role i{flex:none;width:10px;height:10px;border-radius:50%;background:var(--c)}
.tbtn.role span{overflow:hidden;text-overflow:ellipsis}
.tbtn.role b{margin-left:auto;font-weight:400;font-size:.8rem;opacity:.8}

main{padding:14px max(16px, env(safe-area-inset-right)) 130px max(16px, env(safe-area-inset-left))}

.scene{margin:24px 0 10px;padding:10px 14px;background:var(--band);border-radius:var(--r);display:flex;align-items:baseline;gap:4px 10px;flex-wrap:wrap}
.scene .no{font-size:.78rem;font-weight:700;color:var(--pri);letter-spacing:.08em;text-transform:uppercase}
.scene h2{margin:0;font-size:1.08rem}
.scene .zh{color:var(--ink-soft);font-size:.92rem}
.dir{color:var(--faint);font-size:.9rem;margin:10px 4px 10px 6px;padding-left:10px;border-left:3px solid var(--line2)}

.cue{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--lift);border-left:6px solid var(--c);padding:10px 10px 8px 14px;margin:10px 0;transition:opacity .2s, box-shadow .2s}
.who{display:flex;align-items:center;gap:8px;min-height:36px;margin-bottom:2px}
.who strong{font-size:.98rem;flex:none}
.who .en{color:var(--faint);font-size:.82rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.who .tag{display:none;flex:none;font-size:.75rem;font-weight:700;color:var(--pri);background:var(--pri-soft);border-radius:999px;padding:2px 9px}
.cue.before .who .tag{display:inline-block}
.who .jump{flex:none;margin-left:auto;height:34px;min-width:44px;padding:0 10px;border:1px solid var(--line2);border-radius:999px;background:transparent;color:var(--faint);font-size:.8rem;cursor:pointer;font-variant-numeric:tabular-nums}
.who .jump:active{background:var(--board)}
.ln{display:flex;align-items:flex-start;gap:12px;padding:6px 0;border-top:1px solid var(--sep)}
.who + .ln{border-top:none}
.ln .txt{flex:1;min-width:0;font-size:var(--fs);line-height:1.45;padding-top:6px}
.tr{display:none;font-size:calc(var(--fs) * .78);color:var(--ink-soft);margin-top:2px;line-height:1.45}
body.zhon .tr{display:block}
.say{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--pri-line);background:var(--pri-soft);color:var(--pri);cursor:pointer;display:grid;place-items:center;padding:0}
.say svg{width:20px;height:20px}
.say:active{background:var(--band)}
.ln.playing .say{background:var(--pri);border-color:var(--pri);color:#fff}

body.dimming .cue:not(.mine){opacity:.62}
.cue.mine .txt{font-weight:700}
.cue.mine .tr{font-weight:400}
.cue.now{opacity:1 !important;box-shadow:0 0 0 3px var(--pri),var(--lift);background:#f7fbff}

.w{all:unset;cursor:pointer;color:inherit;font-weight:inherit;border-bottom:2px dotted var(--pri);padding:0 1px;touch-action:manipulation}
.w:active{background:var(--pri-soft)}
.w:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
.end{text-align:center;color:var(--faint);margin:30px 0 0;font-weight:700}

/* progress bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);box-shadow:0 -1px 0 var(--line2),0 -4px 14px rgba(32,48,58,.06);
  padding:10px max(14px, env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left))}
.bar .wrap{display:flex;align-items:center;gap:12px}
.nav{flex:none;width:64px;height:52px;border-radius:var(--r);border:1px solid var(--line);background:var(--card);font-size:1.15rem;cursor:pointer}
.nav:active{background:var(--board)}
.nav.next{background:var(--pri);border-color:var(--pri);color:#fff}
.nav.next:active{background:#175c89}
.nav:disabled{opacity:.35}
.status{flex:1;text-align:center;font-size:.85rem;line-height:1.35;color:var(--ink-soft);font-variant-numeric:tabular-nums;min-width:0}
.status b{display:block;font-size:.98rem;color:var(--ink)}
.status .me{color:var(--pri);font-weight:700}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(32,48,58,.35);z-index:9;display:none}
body.open .scrim{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-radius:18px 18px 0 0;
  padding:10px max(16px, env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  transform:translateY(105%);transition:transform .22s ease;max-height:82vh;overflow-y:auto;visibility:hidden}
.sheet.show{transform:none;visibility:visible}
.sheet .wrap{display:flex;flex-direction:column;gap:12px}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line2);margin:0 auto 4px}
.shead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.shead h3{margin:0;font-size:1.1rem}
.x{flex:none;width:44px;height:44px;border:1px solid var(--line2);border-radius:50%;background:var(--card);font-size:1.1rem;cursor:pointer;color:var(--ink-soft)}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rbtn{min-height:58px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px 4px;font-size:.95rem}
.rbtn i{width:12px;height:12px;border-radius:50%;background:var(--c)}
.rbtn[aria-pressed="true"]{border:2px solid var(--pri);background:var(--pri-soft);color:var(--pri);font-weight:700}
.rbtn.all{grid-column:1 / -1;min-height:48px;flex-direction:row}
.word{font-size:1.7rem;font-weight:700;line-height:1.2}
.ipa{color:var(--ink-soft);font-size:1.05rem}
.mean{font-size:1.1rem}
.big{height:52px;border:none;border-radius:var(--r);background:var(--pri);color:#fff;font-weight:700;font-size:1.05rem;cursor:pointer}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--sep)}
.list li:first-child{border-top:none}
.list li div{flex:1;min-width:0}
.list li small{display:block;color:var(--ink-soft)}
.sizes{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.sizes button{height:56px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);cursor:pointer}
.sizes button[aria-pressed="true"]{border:2px solid var(--pri);background:var(--pri-soft);color:var(--pri);font-weight:700}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:999px;font-size:.88rem;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
.toast.show{opacity:1}
#script > .scene:first-child{margin-top:4px}
@media (prefers-reduced-motion: reduce){ .sheet,.cue,.toast{transition:none} }
</style>
</head>
<body>
<div class="head">
  <div class="wrap">
    <h1>公園無菸大作戰</h1>
    <div class="sub">Once Upon a Smoke-Free Park｜基礎訓英文會話劇本</div>
  </div>
</div>

<div class="tools">
  <div class="wrap">
    <button class="tbtn role" id="btnRole" type="button" style="--c:var(--faint)"><i></i><span id="roleName">選角色</span></button>
    <button class="tbtn" id="btnZh" type="button" aria-pressed="false">中文</button>
    <button class="tbtn" id="btnList" type="button">難字</button>
    <button class="tbtn" id="btnSize" type="button">字級</button>
  </div>
</div>

<main>
  <div class="wrap">
    <div id="script"></div>
    <p class="end">The End!</p>
  </div>
</main>

<div class="bar">
  <div class="wrap">
    <button class="nav" id="prev" type="button" aria-label="上一段">◀</button>
    <div class="status" id="status" aria-live="polite"></div>
    <button class="nav next" id="next" type="button" aria-label="下一段">▶</button>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="wrap" id="sheetBody"></div></div>
<div class="toast" id="toast"></div>

<script>
const ROLES = {
  N:   ["旁白", "Narrator", "#7b858c"],
  SW:  ["白雪公主", "Snow White", "#c9a227"],
  RR:  ["小紅帽", "Little Red Riding Hood", "#b9443f"],
  W:   ["大野狼", "Big Bad Wolf", "#8a6a46"],
  H:   ["衛生局人員", "Health Officer", "#2f7a6a"],
  P:   ["警察", "Police Officer", "#2c4677"],
  D:   ["區公所人員", "District Office Staff", "#6c5a9e"],
  C:   ["灰姑娘", "Cinderella", "#c16b93"],
  ALL: ["全體", "Everyone together", "#1d6fa5"]
};

const RAW = `
# Scene 1 | A Beautiful Park | 美麗的公園
~ 白雪公主、小紅帽、灰姑娘在公園散步，大野狼偷偷走進來。
N: Once upon a time, there was a beautiful park. = 很久很久以前，有一座美麗的公園。 | Everyone loved this park. = 大家都很喜歡這座公園。 | One day, three fairy-tale friends came here. = 有一天，三位童話朋友來到這裡。 | But something unusual happened! = 但是，不尋常的事情發生了！
~ 大野狼從口袋拿出香菸，做出抽菸動作。
W: Ha! Ha! = 哈！哈！ | What a nice day for a smoke! = 真是適合抽根菸的好天氣！
SW: Oh, no! Mr. Wolf! = 噢，不！大野狼先生！ | Look at the sign! = 你看那個告示牌！ | No smoking here! = 這裡禁止吸菸！
W: No smoking? = 禁止吸菸？ | But I am the Big Bad Wolf! = 但我可是大野狼耶！
~ 做出吹氣動作
RR: Excuse me! = 不好意思！ | Your smoke is going into my basket! = 你的菸都飄進我的籃子裡了！ | These cookies are for my grandmother. = 這些餅乾是要給我奶奶的。 | She doesn't like secondhand smoke! = 她不喜歡二手菸！
C: Oh, no! = 噢，不！ | My beautiful dress smells like smoke! = 我美麗的禮服都是菸味！ | I just washed it! = 我才剛洗好耶！ | I have to wear it to the ball tonight! = 我今晚還要穿它去參加舞會！
W: Relax, ladies! = 放輕鬆，女士們！ | I am just a smoking wolf! = 我只是一隻愛抽菸的狼！
RR: Mr. Wolf, what big smoke clouds you have! = 大野狼先生，你吐的煙霧怎麼這麼大一團！
SW: A smoking wolf is still a bad wolf! = 愛抽菸的狼還是壞狼！
# Scene 2 | Call the Government! | 召喚公務機關
N: Our three friends did not give up. = 三位朋友沒有放棄。 | They knew who could help them. = 她們知道誰能幫忙。
RR: This is serious! = 這件事很嚴重！ | Let's call the government! = 我們打電話找政府吧！
SW: Good idea! = 好主意！ | We need help from the District Office and the Health Department! = 我們需要區公所和衛生局來幫忙！
~ 灰姑娘拿起手機假裝打電話。
C: Hello! District Office? = 喂！是區公所嗎？ | There is a smoking problem in the park. = 公園裡有人抽菸。 | Please come and help us! = 請來幫幫我們！ | Before midnight, please! = 拜託在午夜十二點前到！
~ 區公所人員上場。
D: Hello, everyone! = 大家好！ | I am from the District Office. = 我是區公所的人員。 | What happened here? = 這裡發生什麼事了？
SW: That wolf is smoking in the no-smoking area! = 那隻狼在禁菸區抽菸！
D: I see. = 我了解了。 | This park has a no-smoking area. = 這座公園有劃設禁菸區。 | We have signs here. = 這裡都有告示牌。 | I will contact the Health Department. = 我會聯絡衛生局。
W: Why did you call so many people? = 你們幹嘛找這麼多人來？ | I only have one cigarette! = 我只有一根菸而已！
D: Because public service is teamwork! = 因為公共服務就是團隊合作！ | One problem, many departments! = 一個問題，很多機關一起處理！
~ 衛生局人員上場。
H: Good afternoon! = 午安！ | I am from the Health Department. = 我是衛生局的人員。 | Who is smoking here? = 是誰在這裡抽菸？
W: Not me! = 不是我！ | Maybe the wind is smoking! = 可能是風在抽菸吧！
RR: The wind can't smoke! = 風才不會抽菸！ | I saw you with my own eyes! = 我親眼看到是你！
H: Sir, please put out your cigarette. = 先生，請把菸熄掉。 | This is a designated no-smoking area. = 這裡是公告的禁菸區。 | And yes, rules apply to wolves, too! = 還有，沒錯，規定對狼一樣適用！
# Scene 3 | The Police Arrive | 警察來了
N: Just then, they heard a siren! = 就在這時，大家聽到了警笛聲！
~ 警察帥氣登場，可以搭配警笛音效。
P: Stop! = 不要動！ | Police! = 警察！ | Someone reported a smoking wolf. = 有人通報一隻狼在抽菸。 | What is happening here? = 這裡發生什麼事？
W: Oh, no! Police! = 噢，不！是警察！ | I am innocent! = 我是無辜的！
RR: Innocent? = 無辜？ | You made the air smoky! = 你把空氣弄得都是菸！ | Cough! Cough! = 咳！咳！
P: Please calm down. = 大家請冷靜。 | We are here to keep everyone safe. = 我們來這裡是為了維護大家的安全。 | Sir, please cooperate with the Health Department. = 先生，請配合衛生局處理。
H: Thank you, Officer. = 謝謝警官。 | Sir, please show us your identification. = 先生，請出示您的身分證件。 | We must follow the proper procedure. = 我們必須依照正當程序辦理。
W: Identification? = 身分證件？ | I only have my wolf ID! = 我只有狼的身分證！
~ 大野狼拿出一張假身分證。
P: A wolf ID? = 狼的身分證？ | That's interesting! = 真有意思！ | The photo looks like a dog. = 照片看起來像一隻狗。 | But we still need to confirm your identity. = 但我們還是得確認你的身分。
SW: Officer, my magic mirror says he is the Big Bad Wolf! = 警官，我的魔鏡說他就是大野狼！
D: Let's work together. = 我們一起合作吧。 | The District Office manages the park. = 區公所負責管理公園。 | The Health Department handles smoking control. = 衛生局負責菸害管制。 | The police help maintain public order. = 警察協助維持公共秩序。
C: Wow! = 哇！ | Government teamwork is like magic! = 政府的團隊合作就像魔法一樣！ | It's even better than my fairy godmother's magic! = 比我神仙教母的魔法還厲害！
SW: Yes! = 沒錯！ | But this is not a fairy tale. = 但這不是童話故事。 | We need real action! = 我們需要真正的行動！
# Scene 4 | The Lesson | 違規者的覺醒
H: Sir, your behavior may violate the Tobacco Hazards Prevention Act. = 先生，您的行為可能違反《菸害防制法》。 | If a violation is confirmed, you may be fined according to the law. = 如果確認違規，將依法處以罰鍰。
W: A fine? = 罰錢？ | How much? = 要罰多少？
P: That depends on the law, not on your tail! = 那要看法律怎麼規定，不是看你的尾巴！
RR: See, Mr. Wolf? = 看吧，大野狼先生？ | Please protect children and older people from secondhand smoke. = 請保護兒童和長輩，別讓他們吸到二手菸。 | People like my grandmother! = 像我奶奶這樣的人！
D: We will also put up bigger signs in the park. = 我們也會在公園裡設置更大的告示牌。
C: And I will help spread the message! = 我也會幫忙宣導！ | I'll post it online! = 我要把它 po 上網！ | A clean park makes everyone happy! = 乾淨的公園讓大家都開心！
P: Remember! = 記住！ | Follow the rules and respect others. = 遵守規定，尊重他人。 | That's how we keep the park safe. = 這樣才能讓公園保持安全。
SW: A beautiful park needs everyone's help! = 美麗的公園需要大家一起守護！
# Scene 5 | Happy Ending | 童話大結局
N: And so, the park became beautiful again. = 就這樣，公園又恢復了美麗。 | The government offices worked together. = 政府機關攜手合作。 | The citizens learned to respect the rules. = 市民學會了尊重規定。 | And the Big Bad Wolf made a big change! = 而大野狼也有了很大的改變！
W: Sorry, everyone! = 對不起，各位！ | I will blow away... = 我要吹走的…… | NOT the people... = 不是人…… | BUT the smoke! = 而是菸！
~ 大野狼做出吹走煙霧的動作，接著丟掉假香菸。
SW: No smoking! = 禁止吸菸！
RR: No secondhand smoke! = 拒絕二手菸！
C: Clean air! = 清新空氣！
D: Good public service! = 優質公共服務！
P: Good cooperation! = 良好合作！
H: A smoke-free environment! = 無菸環境！
ALL: One park! One team! = 一座公園！一個團隊！ | Let's keep our park clean! = 一起讓公園保持乾淨！ | Let's keep our air fresh! = 一起讓空氣保持清新！ | Together, we can make a better Taiwan! = 攜手打造更好的台灣！
`;

// Hard words only: [phrase as it appears, IPA (US), 中文]
const WORDS = [
  ["fairy tale", "/ˈferi ˌteɪl/", "童話"],
  ["unusual", "/ʌnˈjuːʒuəl/", "不尋常的"],
  ["grandmother", "/ˈɡrænˌmʌðər/", "奶奶、外婆"],
  ["secondhand smoke", "/ˌsekəndˈhænd smoʊk/", "二手菸"],
  ["serious", "/ˈsɪriəs/", "嚴重的"],
  ["government", "/ˈɡʌvərnmənt/", "政府"],
  ["District Office", "/ˈdɪstrɪkt ˈɔːfɪs/", "區公所"],
  ["Health Department", "/helθ dɪˈpɑːrtmənt/", "衛生局"],
  ["departments", "/dɪˈpɑːrtmənts/", "部門、機關"],
  ["cigarette", "/ˌsɪɡəˈret/", "香菸"],
  ["put out", "/ˌpʊt ˈaʊt/", "熄滅（菸）"],
  ["designated", "/ˈdezɪɡneɪtɪd/", "指定的"],
  ["apply", "/əˈplaɪ/", "適用"],
  ["innocent", "/ˈɪnəsənt/", "無辜的"],
  ["cooperate", "/koʊˈɑːpəreɪt/", "配合、合作"],
  ["Officer", "/ˈɔːfɪsər/", "警官、官員"],
  ["reported", "/rɪˈpɔːrtɪd/", "通報、檢舉"],
  ["cough", "/kɔːf/", "咳嗽"],
  ["fairy godmother", "/ˈferi ˈɡɑːdˌmʌðər/", "神仙教母"],
  ["identification", "/aɪˌdentɪfɪˈkeɪʃən/", "身分證件"],
  ["procedure", "/prəˈsiːdʒər/", "程序"],
  ["confirm", "/kənˈfɜːrm/", "確認"],
  ["identity", "/aɪˈdentəti/", "身分"],
  ["handles", "/ˈhændəlz/", "負責處理"],
  ["maintain", "/meɪnˈteɪn/", "維持"],
  ["public order", "/ˌpʌblɪk ˈɔːrdər/", "公共秩序"],
  ["behavior", "/bɪˈheɪvjər/", "行為"],
  ["violate", "/ˈvaɪəleɪt/", "違反"],
  ["Tobacco Hazards Prevention Act", "/təˈbækoʊ ˈhæzərdz prɪˈvenʃən ˌækt/", "菸害防制法"],
  ["according to the law", "/əˈkɔːrdɪŋ tə ðə ˈlɔː/", "依法"],
  ["violation", "/ˌvaɪəˈleɪʃən/", "違規行為"],
  ["fined", "/faɪnd/", "被罰款"],
  ["spread the message", "/ˌspred ðə ˈmesɪdʒ/", "傳遞訊息、宣導"],
  ["citizens", "/ˈsɪtɪzənz/", "市民"],
  ["cooperation", "/koʊˌɑːpəˈreɪʃən/", "合作"],
  ["smoke-free", "/ˌsmoʊk ˈfriː/", "無菸的"],
  ["environment", "/ɪnˈvaɪrənmənt/", "環境"]
];

const $ = s => document.querySelector(s);
const store = {
  get(k, d){ try{ const v = localStorage.getItem("smokefree." + k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("smokefree." + k, JSON.stringify(v)); }catch(e){} }
};

const dict = {};
WORDS.forEach(w => dict[w[0].toLowerCase()] = w);
const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
const wordRe = new RegExp("\\b(" + WORDS.map(w => w[0]).sort((a, b) => b.length - a.length).map(esc).join("|") + ")\\b", "gi");
const html = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const mark = s => html(s).replace(wordRe, m => `<button type="button" class="w" data-w="${m.toLowerCase()}">${m}</button>`);
const SPK = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>';

// Parse and render
const cues = [], SAY = [];
let out = "", sceneName = "";
RAW.trim().split("\n").forEach(line => {
  line = line.trim();
  if (!line) return;
  if (line[0] === "#") {
    const [no, en, zh] = line.slice(1).split("|").map(s => s.trim());
    sceneName = no;
    out += `<div class="scene"><span class="no">${no}</span><h2>${en}</h2><span class="zh">${zh}</span></div>`;
  } else if (line[0] === "~") {
    out += `<p class="dir">（${html(line.slice(1).trim())}）</p>`;
  } else {
    const k = line.indexOf(":");
    const role = line.slice(0, k).trim();
    const lines = line.slice(k + 1).split("|").map(s => { const [en, zh] = s.split(" = "); return { en: en.trim(), zh: (zh || "").trim() }; });
    const r = ROLES[role];
    const i = cues.length;
    cues.push({ role, scene: sceneName });
    out += `<div class="cue" data-i="${i}" style="--c:${r[2]}">
      <div class="who"><strong>${r[0]}</strong><span class="en">${r[1]}</span><span class="tag">下一段換你</span>
        <button type="button" class="jump" aria-label="從第 ${i + 1} 段開始">第 ${i + 1} 段</button></div>
      ${lines.map(l => { const n = SAY.push(l.en) - 1; return `<div class="ln" data-l="${n}"><div class="txt">${mark(l.en)}<span class="tr">${html(l.zh)}</span></div><button type="button" class="say" aria-label="播放這一句">${SPK}</button></div>`; }).join("")}
    </div>`;
  }
});
$("#script").innerHTML = out;
const cueEls = [...document.querySelectorAll(".cue")];

// State
let role = store.get("role", "");
if (!ROLES[role] || role === "ALL") role = "";
let cur = -1;
const SIZES = [["小", 16], ["中", 19], ["大", 22], ["特大", 26]];
let size = store.get("size", 1);
if (!SIZES[size]) size = 1;

// Role
function isMine(i){ const r = cues[i].role; return !!role && (r === role || r === "ALL"); }
function applyRole(){
  $("#btnRole").style.setProperty("--c", role ? ROLES[role][2] : "var(--faint)");
  $("#roleName").textContent = role ? ROLES[role][0] : "選角色";
  document.body.classList.toggle("dimming", !!role);
  cueEls.forEach((el, i) => {
    el.classList.toggle("mine", isMine(i));
    el.classList.toggle("before", !!role && !isMine(i) && i + 1 < cues.length && isMine(i + 1));
  });
  updateStatus();
}
function openRoles(){
  const opts = [["", "全部都看"]].concat(Object.keys(ROLES).filter(k => k !== "ALL").map(k => [k, ROLES[k][0]]));
  openSheet(`<div class="grab"></div>
    <div class="shead"><h3>選擇我的角色</h3><button type="button" class="x" aria-label="關閉">✕</button></div>
    <div class="roles">${opts.map(([k, n]) => `<button type="button" class="rbtn${k ? "" : " all"}" data-role="${k}" aria-pressed="${k === role}" style="--c:${k ? ROLES[k][2] : "var(--faint)"}">${k ? "<i></i>" : ""}${n}</button>`).join("")}</div>`);
}
$("#btnRole").addEventListener("click", openRoles);

// Progress
function setCur(i, scroll){
  if (i < 0 || i >= cues.length) return;
  if (cur >= 0) cueEls[cur].classList.remove("now");
  cur = i;
  cueEls[cur].classList.add("now");
  if (scroll) {
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    cueEls[cur].scrollIntoView({ block: "center", behavior: reduce ? "auto" : "smooth" });
  }
  updateStatus();
  keepAwake();
}
function updateStatus(){
  const s = $("#status");
  $("#prev").disabled = cur <= 0;
  $("#next").disabled = cur >= cues.length - 1;
  if (cur < 0) { s.innerHTML = `<b>還沒開始</b>按 ▶ 從第一段開始`; return; }
  let extra = ROLES[cues[cur].role][0];
  if (role) {
    if (isMine(cur)) extra = `<span class="me">輪到你了</span>`;
    else {
      let j = cur + 1; while (j < cues.length && !isMine(j)) j++;
      extra = j < cues.length ? `${ROLES[cues[cur].role][0]}・再 ${j - cur} 段換你` : "你的台詞已經結束";
    }
  }
  s.innerHTML = `<b>${cues[cur].scene}・第 ${cur + 1} / ${cues.length} 段</b>${extra}`;
}
$("#next").addEventListener("click", () => setCur(cur < 0 ? 0 : cur + 1, true));
$("#prev").addEventListener("click", () => setCur(Math.max(0, cur - 1), true));

$("#script").addEventListener("click", e => {
  const w = e.target.closest(".w");
  if (w) { openWord(w.dataset.w); return; }
  const say = e.target.closest(".say");
  if (say) { sayLine(say.closest(".ln")); return; }
  const j = e.target.closest(".jump");
  if (j) setCur(+j.closest(".cue").dataset.i, false);
});

// Chinese
function setZh(on){ document.body.classList.toggle("zhon", on); $("#btnZh").setAttribute("aria-pressed", on ? "true" : "false"); store.set("zh", on); }
$("#btnZh").addEventListener("click", () => setZh(!document.body.classList.contains("zhon")));

// Font size
function applySize(){ document.documentElement.style.setProperty("--fs", SIZES[size][1] + "px"); $("#btnSize").setAttribute("aria-label", "字級：" + SIZES[size][0]); store.set("size", size); }
$("#btnSize").addEventListener("click", () => {
  openSheet(`<div class="grab"></div>
    <div class="shead"><h3>字級</h3><button type="button" class="x" aria-label="關閉">✕</button></div>
    <div class="sizes">${SIZES.map(([n, px], i) => `<button type="button" data-size="${i}" aria-pressed="${i === size}" style="font-size:${px}px">${n}</button>`).join("")}</div>`);
});

// Speech
let voices = [];
function loadVoices(){ try{ voices = speechSynthesis.getVoices(); }catch(e){} }
if ("speechSynthesis" in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function pickVoice(){
  const en = voices.filter(v => /^en[-_]US/i.test(v.lang));
  return en.find(v => /Samantha|Google US English|Aria|Jenny|Ava|Allison/i.test(v.name)) || en[0] || voices.find(v => /^en/i.test(v.lang)) || null;
}
function clearPlaying(){ document.querySelectorAll(".ln.playing").forEach(x => x.classList.remove("playing")); }
function speak(text, done){
  if (!("speechSynthesis" in window)) { toast("這個瀏覽器不支援發音，請改用 Chrome 或 Safari"); if (done) done(); return; }
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US"; u.rate = 0.9;
    const v = pickVoice(); if (v) u.voice = v;
    if (done) { u.onend = done; u.onerror = done; }
    speechSynthesis.speak(u);
  }catch(e){ toast("沒有聲音，請再點一次"); if (done) done(); }
}
function sayLine(ln){
  const was = ln.classList.contains("playing");
  clearPlaying();
  if (was) { try{ speechSynthesis.cancel(); }catch(e){} return; }
  ln.classList.add("playing");
  speak(SAY[+ln.dataset.l], () => ln.classList.remove("playing"));
}

// Sheets
let lastFocus = null;
function openSheet(content){
  lastFocus = document.activeElement;
  clearPlaying();
  $("#sheetBody").innerHTML = content;
  document.body.classList.add("open");
  $("#sheet").classList.add("show");
  const x = $("#sheet .x"); if (x) x.focus({ preventScroll: true });
}
function closeSheet(){
  document.body.classList.remove("open");
  $("#sheet").classList.remove("show");
  if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
}
$("#scrim").addEventListener("click", closeSheet);
document.addEventListener("keydown", e => { if (e.key === "Escape" && document.body.classList.contains("open")) closeSheet(); });
$("#sheet").addEventListener("click", e => {
  if (e.target.closest(".x")) { closeSheet(); return; }
  const r = e.target.closest("[data-role]");
  if (r) { role = r.dataset.role; store.set("role", role); applyRole(); closeSheet(); toast(role ? `${ROLES[role][0]} 的台詞會亮起來` : "顯示全部角色"); return; }
  const z = e.target.closest("[data-size]");
  if (z) { size = +z.dataset.size; applySize(); closeSheet(); return; }
  const b = e.target.closest("[data-say]");
  if (b) speak(b.dataset.say);
});

function openWord(key){
  const w = dict[key]; if (!w) return;
  openSheet(`<div class="grab"></div>
    <div class="shead"><div><div class="word">${w[0]}</div><div class="ipa">${w[1]}</div></div>
      <button type="button" class="x" aria-label="關閉">✕</button></div>
    <div class="mean">${w[2]}</div>
    <button type="button" class="big" data-say="${w[0]}">▶ 再聽一次</button>`);
  speak(w[0]);
}
$("#btnList").addEventListener("click", () => {
  openSheet(`<div class="grab"></div>
    <div class="shead"><h3>難字表（${WORDS.length} 個）</h3><button type="button" class="x" aria-label="關閉">✕</button></div>
    <ul class="list">${WORDS.map(w => `<li><div><strong>${w[0]}</strong><small>${w[1]}　${w[2]}</small></div>
      <button type="button" class="say" data-say="${w[0]}" aria-label="播放 ${w[0]}">${SPK}</button></li>`).join("")}</ul>`);
});

// Keep the screen on while rehearsing, where the browser allows it
let lock = null;
async function keepAwake(){
  if (lock || !("wakeLock" in navigator)) return;
  try{ lock = await navigator.wakeLock.request("screen"); lock.addEventListener("release", () => lock = null); }catch(e){}
}

let tt;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("show"), 2000); }

applySize();
setZh(store.get("zh", false));
applyRole();
</script>
</body>
</html>
